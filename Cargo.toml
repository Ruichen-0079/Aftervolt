[workspace]
resolver = "2"
members = [
    "crates/plain-contracts",
    "crates/plain-world",
    "crates/plain-worldgen",
    "crates/plain-persist",
    "crates/plain-observer",
    "crates/plain-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Electroruin Plain Engineering"]

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
eframe = "0.31"
egui = "0.31"
egui_plot = "0.31"
libm = "0.2"
postcard = { version = "1.1", features = ["alloc"] }
rand_chacha = "0.9"
rand_core = "0.9"
rayon = "1.10"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
zstd = "0.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
